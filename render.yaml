# Render Blueprint — Aura Music
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: aura-music
    runtime: node
    region: singapore   # Change to: oregon, frankfurt, ohio, virginia as needed
    plan: free          # Upgrade to 'starter' ($7/mo) for no sleep + better perf

    buildCommand: npm ci --workspaces=false --include=dev && npm run build
    startCommand: npm start

    # Health check — Render pings this to confirm your service is up
    healthCheckPath: /api/v1/health

    # Auto-deploy on every commit to the linked branch
    autoDeployTrigger: commit

    envVars:
      - key: NODE_ENV
        value: production
