# Render Blueprint — Aura Music
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: aura-music
    runtime: node
    region: singapore   # Change to: oregon, frankfurt, ohio, virginia as needed
    plan: free          # Upgrade to 'starter' ($7/mo) for no sleep + better perf

    buildCommand: rm -f package-lock.json && npm install --legacy-peer-deps && npm run build
    startCommand: npm start

    # Health check — Render pings this to confirm your service is up
    healthCheckPath: /api/music/charts

    # Auto-deploy on every push to the main branch
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production

      # ── Firebase ──────────────────────────────────────────
      - key: VITE_FIREBASE_API_KEY
        sync: false   # Set manually in Render dashboard
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_FIREBASE_MEASUREMENT_ID
        sync: false

      # ── Gemini AI ─────────────────────────────────────────
      - key: VITE_GEMINI_API_KEY
        sync: false

      # ── SMTP Email OTP ────────────────────────────────────
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
